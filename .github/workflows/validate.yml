name: Validate Manasika deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shivUIdes/manasika-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: shivUIdes/manasika-ui/package-lock.json
      - run: npm ci
      - run: npm run check:server
      - run: npm run build
